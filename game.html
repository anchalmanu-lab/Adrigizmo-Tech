    function startNameProcess() {
        const input = document.getElementById('user-name-input').value.trim();
        if (!input) {
            alert("Please enter your name to proceed!");
            return;
        }
        playerName = input;
        document.getElementById('name-screen').classList.add('hidden');
        document.getElementById('selection-screen').classList.remove('hidden');
        document.getElementById('stats-area').classList.remove('hidden');
    }

    function selectField(field) {
        currentField = field;
        document.body.style.backgroundImage = `url('${fieldBackgrounds[field]}')`;
        document.getElementById('selection-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        let pool = [...masterGameData[field]];
        activeQuestions = pool.sort(() => 0.5 - Math.random()).slice(0, 5);

        currentLevel = 0;
        lives = 3;
        timeLeft = 300;
        updateLivesDisplay();
        
        if(timerInterval) clearInterval(timerInterval);
        startTime = Date.now();
        startTimer();
        loadLevel();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').textContent = `Time: ${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                gameOver("⏰ Time's Up! Test session locked down.");
            }
            timeLeft--;
        }, 1000);
    }

    function loadLevel() {
        if (currentLevel >= 5) {
            clearInterval(timerInterval);
            let totalSeconds = Math.floor((Date.now() - startTime) / 1000);
            let finalMins = Math.floor(totalSeconds / 60);
            let finalSecs = totalSeconds % 60;
            timeTakenStr = `${finalMins}m ${finalSecs}s`;
            
            heartsStr = "";
            for(let i=0; i<lives; i++) heartsStr += "❤️";

            document.getElementById('game-card').innerHTML = `
                <h1 style="color: #34d399; text-align: center; font-size: 18px; margin-bottom: 10px;">Congratulations ${playerName} you win the Adrigizmo skill test</h1>
                
                <!-- Colorful Background Certificate Box with Large Logo -->
                <div id="certificate-preview">
                    <div class="cert-top-area">
                        <div class="cert-brand-side">
                            <div class="cert-title">ADRIGIZMO TECH TECHNICS</div>
                            <div class="cert-subtitle">SKILL TEST</div>
                        </div>
                        <div class="cert-emblem">
                            <img src="favicon.png" alt="Emblem" onerror="this.src='https://cdn-icons-png.flaticon.com/512/190/190411.png'">
                        </div>
                    </div>

                    <div class="cert-middle-area">
                        <div class="cert-presented">PROUDLY PRESENTED TO</div>
                        <div class="cert-name">${playerName}</div>
                        <div class="cert-desc">
                            Successfully completed the Skill Test and 🏆 won <b>5🌟 out of 5</b> in <b>${currentField}</b> using <b>${heartsStr}</b> within <b>${timeTakenStr}</b>.
                        </div>
                    </div>

                    <div class="cert-footer-flex">
                        <div class="cert-team">
                            Presented by<br>Team ADRIGIZMO
                        </div>
                        <div class="cert-website-box">
                            Share your friends and invite them for challenge:<br>
                            <strong>www.adrigizmo.com</strong>
                        </div>
                    </div>
                </div>

                <button class="action-btn" onclick="downloadCertificateImage()" style="background: #10b981;">📥 Download Certificate Image</button>
                
                <p style="text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; font-weight: bold;">Share challenge with friends & invite them:</p>
                <div class="share-container">
                    <button class="share-btn wa" onclick="shareSocial('whatsapp')">WhatsApp</button>
                    <button class="share-btn fb" onclick="shareSocial('facebook')">Facebook</button>
                    <button class="share-btn tw" onclick="shareSocial('twitter')">X / Twitter</button>
                    <button class="share-btn li" onclick="shareSocial('linkedin')">LinkedIn</button>
                </div>
                <button class="action-btn" onclick="location.reload()" style="background: #374151; margin-top: 6px;">Play Again</button>
            `;
            return;
        }

        let levelData = activeQuestions[currentLevel];
        document.getElementById('lvl-title').textContent = `Level ${currentLevel + 1} of 5 - ${currentField}`;
        document.getElementById('lvl-desc').textContent = levelData.q;
        
        let optionsHtml = '';
        levelData.options.forEach((opt, index) => {
            optionsHtml += `<button class="option-btn" onclick="checkAnswer(${index})">${String.fromCharCode(65 + index)}. ${opt}</button>`;
        });
        document.getElementById('options-container').innerHTML = optionsHtml;
        document.getElementById('feedback').textContent = '';
        document.getElementById('progress').style.width = ((currentLevel + 1) * 20) + '%';
    }

    function checkAnswer(selectedIndex) {
        let levelData = activeQuestions[currentLevel];
        let feedback = document.getElementById('feedback');

        if (selectedIndex === levelData.answer) {
            feedback.style.color = '#34d399';
            feedback.textContent = "✅ Correct!";
            currentLevel++;
            setTimeout(loadLevel, 800);
        } else {
            lives--;
            updateLivesDisplay();
            if (lives <= 0) {
                clearInterval(timerInterval);
                gameOver("❌ Out of Lives! Test failed.");
                return;
            }
            feedback.style.color = '#ef4444';
            feedback.textContent = `❌ Incorrect answer! Lives remaining: ${lives}`;
        }
    }

    function updateLivesDisplay() {
        let hearts = "";
        for(let i=0; i<lives; i++) hearts += "❤️";
        document.getElementById('lives-display').textContent = hearts;
    }

    function gameOver(message) {
        document.getElementById('game-card').innerHTML = `
            <h1 style="color: #ef4444; text-align: center; font-size: 20px;">❌ Test Failed</h1>
            <p style="text-align: center; color: #d1d5db; margin-top: 12px; font-size: 13px;">${message}</p>
            <div style="background: rgba(31, 41, 55, 0.8); padding: 12px; border-radius: 6px; margin-top: 12px; text-align: center; border: 1px solid #4b5563;">
                <p style="color: #f3f4f6; margin-bottom: 8px; font-size: 13px;">Visit our website and try again!</p>
                <a href="https://www.adrigizmo.com" target="_blank" style="display: inline-block; background: #2563eb; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px;">Visit ADRIGIZMO Website</a>
            </div>
            <button class="action-btn" onclick="location.reload()" style="margin-top: 12px;">Try Again</button>
        `;
    }

    function downloadCertificateImage() {
        const certElement = document.getElementById("certificate-preview");
        html2canvas(certElement, { scale: 2, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `${playerName}-Adrigizmo-Certificate.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
    }

    function shareSocial(platform) {
        let gameUrl = window.location.href;
        let shareText = `🏆 I successfully completed the Adrigizmo Skill Test in ${currentField} with 5 stars using ${heartsStr} in ${timeTakenStr}!\n\nCan you beat my score? Take the challenge now:\n👉 https://www.adrigizmo.com`;

        if(platform === 'whatsapp') {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
        } else if(platform === 'facebook') {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(gameUrl)}&quote=${encodeURIComponent(shareText)}`, '_blank');
        } else if(platform === 'twitter') {
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}`, '_blank');
        } else if(platform === 'linkedin') {
            window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(gameUrl)}`, '_blank');
        }
    }
</script>
